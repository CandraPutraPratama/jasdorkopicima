name: Sync Outlets Kopi Kenangan

on:
  schedule:
    # Berjalan setiap hari pukul 04:00 WIB (21:00 UTC)
    - cron: '0 21 * * *'
  workflow_dispatch: # Mengizinkan trigger manual lewat tombol di GitHub Actions UI

jobs:
  sync:
    name: Sync Outlets to Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Protected Sync Endpoint
        run: |
          echo "Memanggil endpoint sinkronisasi outlet jasdor..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.SYNC_SECRET }}" \
            -H "Content-Type: application/json" \
            https://jasdor.cimagroup.my.id/api/cron/sync-outlets)
          
          BODY=$(echo "$RESPONSE" | sed -e '$d')
          STATUS=$(echo "$RESPONSE" | tail -n 1 | cut -d':' -f2)

          echo "Response Status: $STATUS"
          echo "Response Body: $BODY"

          if [ "$STATUS" -ne 200 ]; then
            echo "❌ Sinkronisasi gagal dengan status $STATUS"
            exit 1
          fi

          echo "✅ Sinkronisasi berhasil!"
