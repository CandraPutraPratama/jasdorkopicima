name: Sync Status Outlet TOMORO

# Cron dinonaktifkan: status outlet TOMORO kini 100% mandiri di database Supabase lokal
# sehingga tidak ada request berkala ke cingops. Bisa dijalankan manual jika diperlukan via workflow_dispatch.
on:
  workflow_dispatch: # Bisa dijalankan manual dari tab Actions jika diperlukan

jobs:
  sync-tomoro:
    name: Sync Status TOMORO ke Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Endpoint Sync Status TOMORO
        run: |
          echo "Memanggil endpoint sinkronisasi status TOMORO..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.SYNC_SECRET }}" \
            -H "Content-Type: application/json" \
            "https://jasdor.cimagroup.my.id/api/cron/sync-outlets?brand=tomoro")

          BODY=$(echo "$RESPONSE" | sed -e '$d')
          STATUS=$(echo "$RESPONSE" | tail -n 1 | cut -d':' -f2)

          echo "Response Status: $STATUS"
          echo "Response Body: $BODY"

          if [ "$STATUS" -ne 200 ]; then
            echo "Sinkronisasi status TOMORO gagal dengan status $STATUS"
            exit 1
          fi

          echo "Sinkronisasi status TOMORO berhasil!"
